name: ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install
      - run: bun typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install
      - name: Configure git identity
        run: |
          git config --global user.email "ci@opencode.ai"
          git config --global user.name "opencode-ci"
      - run: bun turbo test

  build-linux:
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install
      - name: Build all Linux targets
        run: bun ./script/build.ts --skip-install
        working-directory: packages/opencode
      - name: Package
        run: |
          cd packages/opencode/dist
          for dir in opencode-linux-*/; do
            name=${dir%/}
            tar -czf "${name}.tar.gz" -C "${name}" bin
          done
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-linux
          path: packages/opencode/dist/opencode-linux-*.tar.gz
          retention-days: 30

  build-macos:
    needs: [typecheck, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install
      - name: Build all macOS targets
        run: bun ./script/build.ts --skip-install
        working-directory: packages/opencode
      - name: Package
        run: |
          cd packages/opencode/dist
          for dir in opencode-darwin-*/; do
            name=${dir%/}
            zip -r "${name}.zip" "${name}/bin"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-macos
          path: packages/opencode/dist/opencode-darwin-*.zip
          retention-days: 30
