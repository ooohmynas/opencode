name: ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install
      - run: bun typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install
      - name: Configure git identity
        run: |
          git config --global user.email "ci@opencode.ai"
          git config --global user.name "opencode-ci"
      - run: bun turbo test

  build:
    needs: [typecheck, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: opencode-linux-x64
          - os: macos-latest
            name: opencode-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install

      - name: Build
        run: bun ./script/build.ts --single --skip-install
        working-directory: packages/opencode

      - name: Package
        run: tar -czf ${{ matrix.name }}.tar.gz -C packages/opencode/dist/${{ matrix.name }} bin

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz
          retention-days: 30
